<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TerraAR • Geographic Landscape AR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app-root" class="app-root" data-view="split">
      <!-- Status HUD Bar (Top) -->
      <header id="status-hud" class="hud-top"></header>

      <!-- Main Visual Viewport Container -->
      <main class="viewport-split-container">
        <!-- AR Camera & 3D Layer (Top 60% in split mode) -->
        <section id="ar-viewport" class="ar-section"></section>

        <!-- Interactive Bottom Map (Bottom 40% in split mode) -->
        <section id="map-viewport" class="map-section"></section>
      </main>

      <!-- Bottom Navigation Controls -->
      <nav id="bottom-controls" class="hud-bottom"></nav>

      <!-- Overlays and Modals -->
      <div id="permission-overlay"></div>
      <div id="settings-overlay"></div>
      <div id="modal-overlay"></div>
      <div id="debug-overlay"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
